[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "magpyxl"
version = "0.2.2"
description = "Rust-powered Spreadsheet/Excel-formula engine for Python working natively across pandas, polars, and CSV/XLSX."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "Ritik Meena" }
]

keywords = [
    "excel",
    "spreadsheet",
    "rust",
    "pandas",
    "polars",
    "xlookup",
    "vlookup",
    "sumifs",
    "info",
    "clean",
    "ohters"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ritik197/magPyXL"
Repository = "https://github.com/ritik197/magPyXL"
Issues = "https://github.com/ritik197/magPyXL/issues"

[tool.maturin]
python-source = "python"
module-name = "magpyxl._core"