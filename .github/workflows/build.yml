name: Build and publish wheels

# Builds ONE wheel per platform (Linux x86_64, Windows x86_64, macOS
# universal2) because the crate uses PyO3's abi3-py38 stable ABI — a
# single compiled wheel per platform works on Python 3.8 through every
# future 3.x release, so there's no need for a Python-version build
# matrix at all.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels (universal2: arm64 + x86_64)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --target universal2-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Only runs when you push a tag like v0.1.1 — uploads everything built
  # above to PyPI in one go. Requires either PYPI_API_TOKEN as a repo
  # secret, or PyPI Trusted Publishing configured for this repo (in which
  # case you can delete the `password:` line below).
  publish:
  name: Publish to PyPI
  if: startsWith(github.ref, 'refs/tags/v')
  needs: [linux, windows, macos, sdist]
  runs-on: ubuntu-latest

  permissions:
    id-token: write

  environment:
    name: pypi

  steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      uses: PyO3/maturin-action@v1
      with:
        command: upload
        args: --non-interactive dist/*
